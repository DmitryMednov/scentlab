  --bone-200:#EFE8DC;

  --bone-400:#CBBEAA;
  --bone-500:#A99B86;
  --bone-600:#7D7161;

  /* Gold — the one accent. Leaf-gold, never yellow, never neon */
  --gold-100:#EBD8B4;
  --gold-300:#D6BA85;
  --gold-400:#C79E5A;

  --scene-mint:#5C7A5E;
  --scene-coffee:#8A5A34;
  --scene-cream:#C89C6E;
  --scene-citrus:#E08A2B;
  --scene-water:#2E4A52;
  --scene-fire:#C4521C;
  --scene-wind:#D8C3A2;
  --scene-ocean:#E2913C;

  /* Semantic status — muted, natural, never candy */
  --status-positive:#4F6B4A;
  --status-caution:#B8873B;
  --status-critical:#A03D26;
  --status-info:#3F5A63;

  /* ── Semantic aliases (use these in components) ───────────────────────── */
  --text-primary:var(--ink-800);
  --text-body:var(--ink-600);
  --text-muted:var(--bone-600);
  --text-inverse:var(--bone-100);
  --text-inverse-muted:rgba(247,243,236,.62);
  --text-accent:var(--gold-600);

/* ── Type system ───────────────────────────────────────────────────────────
   Two families. Cormorant Garamond carries every voice moment (scene titles,
   section headings, pull quotes). Jost carries every functional moment (body,
   labels, buttons, eyebrows). Never a third family. */
:root{
  --font-display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --font-text:"Jost","Futura","Avenir Next",-apple-system,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,monospace;

  /* Weights — display never exceeds 400; the elegance is in the contrast, not the mass */
  --weight-display-light:300; /* @kind font */
  --weight-display:400; /* @kind font */
  --weight-text-light:300; /* @kind font */
  --weight-text:400; /* @kind font */
  --weight-text-medium:500; /* @kind font */

  /* Scale — display sizes are fluid and cinematic; text sizes are fixed */
  --size-display-1:clamp(3.5rem,9vw,8.5rem);   /* scene titles, hero message */
  --size-display-2:clamp(2.75rem,6vw,5.5rem);  /* section openers */
  --size-display-3:clamp(2rem,4vw,3.5rem);     /* card headlines, quotes */
  --size-display-4:1.75rem;                    /* small serif headings */
  --size-body-lg:1.1875rem;
  --size-body:1.0625rem;
  --size-body-sm:0.9375rem;
  --size-caption:0.8125rem;
  --size-eyebrow:0.6875rem;

  /* Line heights */
  --leading-display:0.96; /* @kind font */
  --leading-display-loose:1.08; /* @kind font */
  --leading-heading:1.18; /* @kind font */
  --leading-body:1.62; /* @kind font */
  --leading-tight:1.35; /* @kind font */

  /* Tracking — display tightens, eyebrows open wide */
  --tracking-display:-0.02em; /* @kind font */
  --tracking-heading:-0.01em; /* @kind font */
  --tracking-body:0; /* @kind font */
  --tracking-label:0.04em; /* @kind font */
  --tracking-eyebrow:0.22em; /* @kind font */
  --tracking-eyebrow-wide:0.32em; /* @kind font */

  /* Measure */
  --measure-prose:62ch; /* @kind font */
  --measure-narrow:44ch; /* @kind font */
  --measure-caption:34ch; /* @kind font */
}

/* ── Space & layout ────────────────────────────────────────────────────────
   4px base, but the brand lives in the large end of the scale: sections
   breathe at --space-4xl and up. Whitespace is the luxury signal. */
:root{
  --space-2xs:4px;
  --space-xs:8px;
  --space-sm:12px;
  --space-md:16px;
  --space-lg:24px;
  --space-xl:32px;

  --section-y:clamp(96px,12vw,180px); /* @kind spacing */

  --container-full:100%;
  --container-wide:1440px;
  --container:1180px;

}

/* ── Corner radii ──────────────────────────────────────────────────────────
   Restrained. Cards and images are near-square (2px) so photography reads as

    --scrim-bottom:linear-gradient(to top,rgba(16,12,9,.82) 0%,rgba(16,12,9,.52) 34%,rgba(16,12,9,0) 78%); /* @kind other */
